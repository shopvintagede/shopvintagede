<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin · Angebote</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f5ef;color:#1a1916;margin:0;padding:24px;}
main{max-width:520px;margin:0 auto;background:#fff;border:1px solid #e4dec9;border-radius:8px;padding:28px;}
h1{font-size:22px;margin:0 0 18px;} label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
input[type=text],input[type=number],input[type=password]{width:100%;box-sizing:border-box;padding:11px;border:1px solid #e4dec9;border-radius:4px;font-size:15px;}
.row{display:flex;gap:12px;} .row>div{flex:1;} .chk{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:16px;}
button{margin-top:18px;padding:12px 20px;border:0;border-radius:4px;background:#3b4233;color:#fff;font-size:15px;cursor:pointer;}
button.sec{background:#fff;color:#3b4233;border:1px solid #3b4233;margin-left:8px;}
#msg{margin-top:18px;font-size:14px;line-height:1.5;} .status{background:#eaf0e6;border-radius:6px;padding:12px;margin-top:18px;font-size:14px;}
</style></head><body><main>
<h1>Angebote verwalten</h1>
<label for="pw">Admin-Passwort</label><input type="password" id="pw" autocomplete="current-password">
<button id="btnStatus" class="sec" style="margin-left:0">Aktuelles Angebot anzeigen</button>
<div id="status" class="status" hidden></div>
<hr style="margin:26px 0;border:0;border-top:1px solid #e4dec9">
<h2 style="font-size:17px;margin:0">Neues Angebot starten</h2>
<label for="title">Titel</label><input type="text" id="title" value="Shop-Vintage.de Eröffnung">
<div class="row"><div><label for="percent">Rabatt in %</label><input type="number" id="percent" value="15" min="1" max="100"></div>
<div><label for="hours">Dauer in Stunden</label><input type="number" id="hours" value="48" min="1"></div></div>
<label for="code">Rabattcode</label><input type="text" id="code" value="OPENING15">
<label class="chk"><input type="checkbox" id="first" checked> Nur für Neukunden (erste Bestellung)</label>
<button id="btnCreate">Angebot jetzt starten</button><button id="btnEnd" class="sec">Laufendes Angebot beenden</button>
<div id="msg"></div></main>
<script>
const $ = id => document.getElementById(id);
async function call(body){
  const r = await fetch('/.netlify/functions/admin',{method:'POST',headers:{'content-type':'application/json','x-admin-password':$('pw').value},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({error:'Keine Antwort vom Server'}));
  if(!r.ok) throw new Error(j.error||'Fehler'); return j;
}
const fmt = o => o ? `${o.title}: ${o.percent}% · Code ${o.code} · endet ${new Date(o.endsAt).toLocaleString('de-DE')}` : 'Kein Angebot aktiv.';
const say = (t,ok=true) => { $('msg').style.color = ok?'#2d6a2d':'#b00020'; $('msg').textContent = t; };
$('btnStatus').onclick = async()=>{ try{ const j=await call({action:'status'});$('status').hidden=false; $('status').textContent=fmt(j.offer);}catch(e){say(e.message,false);} };$('btnCreate').onclick = async()=>{ try{ const j=await call({action:'create',title:$('title').value,percent:$('percent').value,hours:$('hours').value,code:$('code').value,firstOnly:$('first').checked}); say('Gestartet. '+fmt(j.offer)); }catch(e){say(e.message,false);} };$('btnEnd').onclick = async()=>{ if(!confirm('Angebot wirklich beenden?')) return; try{ await call({action:'end'}); say('Angebot beendet.'); }catch(e){say(e.message,false);} };
</script></body></html>
