<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>shopvintage – Admin</title>
  <style>
    :root{--bg:#f7f5ef;--card:#fff;--ink:#1a1916;--ol:#3b4233;--line:#e4dec9;--mu:#635d51}
    @media(prefers-color-scheme:dark){:root{--bg:#1a1916;--card:#25231f;--ink:#f1eee4;--ol:#8fa17b;--line:#37342c;--mu:#b0aa9b}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
    [hidden]{display:none!important}
    button,input,select,textarea{font:inherit;color:var(--ink)}
    button{padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer}
    button.p{background:var(--ol);color:#fff;border-color:var(--ol)}button:disabled{opacity:.5}
    input,select,textarea{padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--card);width:100%}
    #login{max-width:340px;margin:20vh auto;padding:20px;display:grid;gap:12px}
    header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
    header h1{font-size:18px;margin:0 auto 0 0}#state{font-size:13px;color:var(--mu)}
    main{max-width:900px;margin:0 auto;padding:20px;display:grid;gap:12px}
    .row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
    .row img{width:48px;height:60px;object-fit:cover;border-radius:4px;background:var(--line)}
    .row .t{flex:1;min-width:0}.row small{display:block;color:var(--mu)}.sold{opacity:.5}
    dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:min(640px,94vw);padding:20px}
    dialog::backdrop{background:rgba(0,0,0,.5)}
    form{display:grid;gap:12px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
    label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
    .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .pic{border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:12px;color:var(--mu);text-align:center}
    .pic img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--line);margin-bottom:6px}
    .pic input{padding:4px;font-size:12px}.btns{display:flex;gap:10px}
  </style>
</head>
<body>

<div id="login">
  <h1>shopvintage – Admin</h1>
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password">
  <button id="go" class="p">Anmelden</button>
  <p id="lerr" style="color:#c0392b;margin:0"></p>
</div>

<div id="app" hidden>
  <header><h1>Artikel verwalten</h1><span id="state"></span>
    <button id="new">+ Neuer Artikel</button><button id="pub" class="p" disabled>Veröffentlichen</button></header>
  <main><input id="q" placeholder="Suchen (Name, Marke, Kategorie) …"><div id="list"></div></main>
</div>

<dialog id="dlg"><form id="f">
  <div class="g">
    <label>Marke<input id="brand" required></label>
    <label>Name / Titel<input id="name" required></label>
    <label>Kategorie<select id="cat"><option>Pullover</option><option>Shirts</option><option>Trackpants</option><option>Jeans</option><option>Winterjacken</option></select></label>
    <label>Größe<input id="size" required></label>
    <label>Preis in €<input id="price" type="number" step="0.01" min="0.5" required></label>
    <label>Status<select id="sold"><option value="0">Verfügbar</option><option value="1">Verkauft (ausgeblendet)</option></select></label>
  </div>
  <label>Beschreibung<textarea id="desc" rows="3"></textarea></label>
  <div class="pics" id="pics"></div>
  <div class="btns"><button class="p" type="submit">Übernehmen</button><button type="button" id="cancel">Abbrechen</button></div>
</form></dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
let pw='',items=[],cur=null,isNew=false,dirty=false,newPics={};

async function api(body){
  const r=await fetch('/.netlify/functions/admin-save',{method:'POST',body:JSON.stringify({password:pw,...body})});
  const d=await r.json().catch(()=>({error:'Serverfehler'}));
  if(!r.ok) throw new Error(d.error||'Fehler');
  return d;
}
async function login(){
  pw=$('pw').value||pw; $('lerr').textContent='';
  try{items=(await api({action:'load'})).products;sessionStorage.setItem('pw',pw);$('login').hidden=true;$('app').hidden=false;render()}
  catch(e){$('lerr').textContent=e.message;sessionStorage.removeItem('pw')}
}
$('go').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
if(sessionStorage.getItem('pw')){pw=sessionStorage.getItem('pw');login()}

function setDirty(v){dirty=v;$('pub').disabled=!v;$('state').textContent=v?'Ungespeicherte Änderungen':''}
window.onbeforeunload=()=>dirty?'Es gibt nicht veröffentlichte Änderungen.':undefined;

function render(){
  const q=$('q').value.toLowerCase();
  $('list').innerHTML=items.map((i,k)=>({i,k})).filter(({i})=>(i.brand+' '+i.name+' '+i.cat).toLowerCase().includes(q)).map(({i,k})=>
    `<div class="row ${i.sold?'sold':''}"'><img src="${newPics[i.folder]?.[0]||`images/${esc(i.folder)}/A1.jpeg`}" alt="">
    <div class="t"><b>${esc(i.brand)} – ${esc(i.name)}</b><small>${esc(i.cat)} · Gr. ${esc(i.size)} · ${eur(i.price)}${i.sold?' · VERKAUFT':''}</small></div>
    <button data-e="${k}">Bearbeiten</button><button data-d="${k}">Löschen</button></div>`).join('')||'<p>Keine Artikel gefunden.</p>';
}
$('q').oninput=render;
$('list').onclick=e=>{
  if(e.target.dataset.e!==undefined) edit(items[e.target.dataset.e],false);
  if(e.target.dataset.d!==undefined&&confirm('Artikel wirklich löschen?')){items.splice(e.target.dataset.d,1);setDirty(true);render()}
};
$('new').onclick=()=>{const id=Math.max(0,...items.map(i=>i.id))+1;edit({id,folder:'Art'+id,cat:'Pullover',brand:'',name:'',size:'',desc:'',price:15,sold:false},true)};

function edit(it,n){
  cur=it;isNew=n;
  ['brand','name','cat','size','desc','price'].forEach(k=>$(k).value=it[k]);
  $('sold').value=it.sold?'1':'0';
  newPics[it.folder]=newPics[it.folder]||[];
  $('pics').innerHTML=[0,1,2].map(i=>`<div class="pic"><img id="p${i}" src="${newPics[it.folder][i]||`images/${esc(it.folder)}/A${i+1}.jpeg`}" alt="" onerror="this.removeAttribute('src')">Foto ${i+1}${i?'':' (Titelbild)'}<input type="file" accept="image/*" data-n="${i}"></div>`).join('');
  $('dlg').showModal();
}
$('pics').onchange=e=>{
  const n=+e.target.dataset.n,file=e.target.files[0];if(!file)return;
  const im=new Image();
  im.onload=()=>{
    const s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',.82);newPics[cur.folder][n]=d;$('p'+n).src=d;
  };
  im.src=URL.createObjectURL(file);
};
$('f').onsubmit=e=>{
  e.preventDefault();
  Object.assign(cur,{brand:$('brand').value.trim(),name:$('name').value.trim(),cat:$('cat').value,size:$('size').value.trim(),desc:$('desc').value.trim(),price:parseFloat($('price').value),sold:$('sold').value==='1'});
  if(isNew) items.push(cur);
  $('dlg').close();setDirty(true);render();
};
$('cancel').onclick=()=>$('dlg').close();

$('pub').onclick=async()=>{
  const images=[];
  Object.entries(newPics).forEach(([f,a])=>a.forEach((d,i)=>d&&images.push({folder:f,n:i+1,data:d.split(',')[1]})));
  $('pub').disabled=true;$('state').textContent='Wird gespeichert …';
  try{
    await api({action:'save',products:items,images});
    newPics={};dirty=false;$('state').textContent='✓ Gespeichert. In ca. 1–2 Minuten live.';
  }catch(e){$('state').textContent='Fehler: '+e.message;$('pub').disabled=false}
};
</script>
</body>
</html>
