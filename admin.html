<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shop-Admin</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f4f1ea;color:#222;margin:0;padding:16px}
  .card{max-width:640px;margin:0 auto 16px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  h2,h3{margin-top:0}
  label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
  input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;background:#fff}
  textarea{min-height:80px}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:#222;color:#fff;margin-top:16px;cursor:pointer}
  button:disabled{opacity:.5}
  .small{width:auto;padding:8px 12px;font-size:14px;margin:8px 8px 0 0}
  .red{background:#c0392b}.grey{background:#777}
  .item{padding:12px 0;border-bottom:1px solid #eee}
  .item small{color:#777}
  .hidden{display:none}
  .sold{opacity:.55}
  #status{position:fixed;left:16px;right:16px;bottom:16px;max-width:640px;margin:auto;background:#222;color:#fff;padding:14px;border-radius:10px;display:none;text-align:center}
</style>
</head>
<body>

<div id="login" class="card">
  <h2>Admin Login</h2>
  <label for="pw">Passwort</label>
  <input type="password" id="pw" autocomplete="current-password">
  <button id="loginBtn">Einloggen</button>
</div>

<div id="app" class="hidden">
  <div class="card">
    <h3>Neuen Artikel hinzufügen</h3>
    <label for="n-name">Name</label>
    <input id="n-name" placeholder="z. B. Pullover Nike Grau">
    <label for="n-cat">Kategorie</label>
    <select id="n-cat"></select>
    <label for="n-brand">Marke</label>
    <input id="n-brand" placeholder="z. B. Nike">
    <label for="n-size">Größe</label>
    <input id="n-size" placeholder="z. B. M oder 32/34">
    <label for="n-price">Preis in Euro</label>
    <input id="n-price" inputmode="decimal" placeholder="z. B. 25">
    <label for="n-desc">Beschreibung</label>
    <textarea id="n-desc" placeholder="Kurze Beschreibung"></textarea>
    <label for="n-imgs">Fotos (bis zu 3, das erste ist das Titelbild)</label>
    <input type="file" id="n-imgs" accept="image/*" multiple>
    <button id="addBtn">Artikel speichern</button>
  </div>

  <div class="card">
    <h3>Vorhandene Artikel (<span id="count">0</span>)</h3>
    <div id="list"></div>
  </div>
</div>

<div id="status"></div>

<script>
let password = '';
let products = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function msg(t, ms = 4000) {
  const s = $('status'); s.textContent = t; s.style.display = 'block';
  clearTimeout(msg.t); if (ms) msg.t = setTimeout(() => s.style.display = 'none', ms);
}

async function api(body) {
  const res = await fetch('/.netlify/functions/admin-save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password, ...body })
  });
  let data;
  try { data = await res.json(); } catch { throw new Error('Der Server hat nicht richtig geantwortet (Status ' + res.status + ').'); }
  if (!res.ok) throw new Error(data.error || 'Fehler ' + res.status);
  return data;
}

async function load(isLogin) {
  try {
    const data = await api({ action: 'load' });
    products = Array.isArray(data.products) ? data.products : [];
    fillCategories();
    render();
    if (isLogin) { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }
  } catch (e) { alert('Fehler: ' + e.message); }
}

function fillCategories() {
  const cats = [...new Set(products.map(p => p.cat).filter(Boolean))];
  ['Trackpants','Pullover','Shirts','Jeans','Winterjacken'].forEach(c => { if (!cats.includes(c)) cats.push(c); });
  $('n-cat').innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join('');
}

function render() {
  $('count').textContent = products.length;
  $('list').innerHTML = products.map((p, i) => `
    <div class="item ${p.sold ? 'sold' : ''}">
      <strong>${esc(p.name)}</strong> ${p.sold ? '(verkauft)' : ''}<br>
      <small>${esc(p.cat)} · ${esc(p.brand)} · Gr. ${esc(p.size)} · ${esc(p.price)} € · Ordner ${esc(p.folder)}</small><br>
      <button class="small grey" data-sold="${i}">${p.sold ? 'Wieder verfügbar' : 'Als verkauft markieren'}</button>
      <button class="small red" data-del="${i}">Löschen</button>
    </div>`).join('');
}

// Foto verkleinern und als JPEG umwandeln (damit der Upload klein und schnell bleibt)
function toJpegBase64(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto konnte nicht gelesen werden: ' + file.name)); };
    img.src = url;
  });
}

function nextNumber() {
  return products.reduce((m, p) => {
    const a = /^Art(\d+)$/.exec(p.folder || ''); return Math.max(m, a ? +a[1] : 0, +p.id || 0);
  }, 0) + 1;
}

async function save(newList, images, okText) {
  msg('Speichere … bitte kurz warten', 0);
  try {
    await api({ action: 'save', products: newList, images: images || [] });
    products = newList; render();
    msg(okText + ' Die Seite aktualisiert sich nach ca. 1 Minute.', 6000);
    return true;
  } catch (e) { msg('', 1); alert('Fehler: ' + e.message); return false; }
}

$('loginBtn').onclick = () => {
  password = $('pw').value;
  if (!password) return alert('Bitte Passwort eingeben.');
  load(true);
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

$('addBtn').onclick = async () => {
  const name = $('n-name').value.trim(), brand = $('n-brand').value.trim(),
        size = $('n-size').value.trim(), desc = $('n-desc').value.trim(),
        cat = $('n-cat').value, price = parseFloat($('n-price').value.replace(',', '.'));
  const files = [...$('n-imgs').files].slice(0, 3);
  if (!name || !size || !(price >= 0) || isNaN(price)) return alert('Bitte Name, Größe und Preis ausfüllen.');
  if (!files.length) return alert('Bitte mindestens ein Foto auswählen.');

  $('addBtn').disabled = true;
  try {
    msg('Fotos werden vorbereitet …', 0);
    const n = nextNumber(), folder = 'Art' + n;
    const images = [];
    for (let i = 0; i < files.length; i++) images.push({ folder, n: i + 1, data: await toJpegBase64(files[i]) });
    const item = { id: n, folder, cat, brand: brand || 'Vintage', name, size, desc, price, sold: false };
    const ok = await save([...products, item], images, 'Artikel gespeichert.');
    if (ok) ['n-name','n-brand','n-size','n-price','n-desc','n-imgs'].forEach(id => $(id).value = '');
  } catch (e) { msg('', 1); alert('Fehler: ' + e.message); }
  $('addBtn').disabled = false;
};

$('list').addEventListener('click', async e => {
  const s = e.target.dataset.sold, d = e.target.dataset.del;
  if (s !== undefined) {
    const list = products.map((p, i) => i == s ? { ...p, sold: !p.sold } : p);
    await save(list, [], 'Geändert.');
  } else if (d !== undefined) {
    if (!confirm('Artikel „' + products[d].name + '“ wirklich löschen?')) return;
    await save(products.filter((_, i) => i != d), [], 'Gelöscht.');
  }
});
</script>
</body>
</html>
