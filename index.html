<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>shopvintage.de — Secondhand & Vintage Mode aus Uplengen</title>
<meta name="description" content="shopvintage.de aus Uplengen: Secondhand- und Vintage-Mode. Handverlesen und ehrlich beschrieben. Stay tuned 2027.">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f7f5ef;
  --cream-card:#ffffff;
  --ink:#1a1916;
  --olive:#3b4233;
  --olive-light:#eaf0e6;
  --accent-gold:#d4a373;
  --vinted:#09b1ba;
  --instagram:#e1306c;
  --line:#e4dec9;
  --muted:#635d51;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:'Work Sans',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;margin:0;}
img{max-width:100%; display:block;}
a{color:inherit;}

header{
  position:sticky;top:0;background:rgba(247, 245, 239, 0.95);
  border-bottom:1px solid var(--line);z-index:10;
  backdrop-filter: blur(10px);
}
.nav{
  max-width:1100px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;padding:18px 24px;
}
.logo-text{font-family:'Fraunces',serif;font-size:22px;letter-spacing:0.5px;text-decoration:none;}
.logo-text em{font-style:normal;color:var(--olive);}

.navlinks{display:flex;gap:24px;font-size:14px;align-items:center;}
.navlinks a{text-decoration:none;border-bottom:1px solid transparent;transition:color .2s;}
.navlinks a:hover{color:var(--olive);}
.nav-badge{background:var(--vinted);color:#fff;padding:6px 14px;border-radius:20px;font-weight:500;transition:opacity .2s;}
.nav-badge:hover{opacity:0.9;}
@media (max-width:640px){.navlinks{display:none;}}

.hero{
  max-width:1100px;margin:0 auto;padding:64px 24px 40px;display:grid;grid-template-columns:1.2fr 0.8fr;gap:40px;align-items:center;
  background: radial-gradient(circle at 10% 20%, rgba(234, 240, 230, 0.7) 0%, transparent 60%);
}
@media (max-width:800px){.hero{grid-template-columns:1fr;padding-top:40px;text-align:center;}}
.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.05;color:var(--ink);}
.hero p{max-width:46ch;color:var(--muted);font-size:16px;line-height:1.6;margin-top:16px;}
@media (max-width:800px){.hero p{margin:16px auto 0;}}
.hero-cta{display:inline-block;margin-top:26px;background:var(--olive);color:#fff;
  padding:13px 26px;text-decoration:none;font-size:14px;border-radius:4px;transition:background .2s;}
.hero-cta:hover{background:var(--ink);}
.hero-cta-second{display:inline-block;margin-top:26px;margin-left:10px;border:1px solid var(--olive);color:var(--olive);
  padding:12px 24px;text-decoration:none;font-size:14px;border-radius:4px;transition:all .2s;}
.hero-cta-second:hover{background:var(--olive);color:#fff;}
@media (max-width:800px){.hero-cta-second{margin-left:0;}}

@keyframes spin360 {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.hero-logo-box{display:flex;justify-content:center;align-items:center;}
.hero-logo-box img{
  max-width:200px;
  width:100%;
  height:auto;
  filter:drop-shadow(0 12px 24px rgba(59,66,51,0.15));
  animation: spin360 14s linear infinite;
}
.hero-logo-box img:hover {
  animation-play-state: paused;
}

.payrow{max-width:1100px;margin:0 auto;padding:0 24px 40px;display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);}
.paybadge{background:var(--cream-card);border:1px solid var(--line);padding:7px 14px;border-radius:20px;font-weight:500;}

section.products{max-width:1100px;margin:0 auto;padding:20px 24px 70px;}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px;border-bottom:1px solid var(--line);padding-bottom:14px;}
.section-head h2{font-size:26px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;}
.card{background:var(--cream-card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s ease, box-shadow .25s ease;}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(26,25,22,0.08);}
.thumb{aspect-ratio:4/5;position:relative;overflow:hidden;background:#f0eee5;}
.thumb img{width:100%; height:100%; object-fit:cover;}
.thumb .tag{position:absolute;top:10px;left:10px;background:rgba(255,255,255,0.92);color:var(--ink);font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,0.05);}
.card-body{padding:16px;flex:1;display:flex;flex-direction:column;}
.brand{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-weight:600;}
.name{font-family:'Fraunces',serif;font-size:16.5px;margin-top:4px;line-height:1.3;}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;}
.pricerow{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;}
.price{font-size:16.5px;font-weight:600;color:var(--olive);}
.view-btn{font-size:12.5px;background:transparent;border:1px solid var(--ink);color:var(--ink);padding:7px 14px;border-radius:20px;font-weight:500;transition:all .2s;}
.card:hover .view-btn{background:var(--ink);color:#fff;}

.blog-section{max-width:1100px;margin:0 auto;padding:20px 24px 70px;}
.blog-intro{max-width:62ch;color:var(--muted);font-size:15.5px;line-height:1.7;margin:-8px 0 30px;}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start;}
@media(max-width:900px){.blog-grid{grid-template-columns:1fr;}}
.blog-card{background:var(--cream-card);border:1px solid var(--line);border-radius:6px;padding:26px 24px;}
.blog-meta{font-size:12px;color:var(--muted);font-weight:500;}
.blog-card h3{font-size:20px;line-height:1.25;margin-top:10px;}
.blog-teaser{font-size:14.5px;line-height:1.7;color:var(--muted);margin:12px 0 0;}
.blog-card details{margin-top:14px;}
.blog-card summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--olive);list-style:none;display:inline-block;border-bottom:1px solid var(--olive);padding-bottom:2px;}
.blog-card summary::-webkit-details-marker{display:none;}
.blog-card details[open] summary{margin-bottom:14px;}
.blog-card details[open] summary .more{display:none;}
.blog-card summary .less{display:none;}
.blog-card details[open] summary .less{display:inline;}
.blog-card details p{font-size:14.5px;line-height:1.75;color:var(--muted);margin:0 0 12px;}
.blog-card details p:last-child{margin-bottom:0;}
.blog-note{margin-top:30px;background:var(--olive-light);border:1px solid var(--line);border-radius:8px;padding:28px 30px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;}
@media(max-width:768px){.blog-note{grid-template-columns:1fr;gap:18px;padding:24px;}}
.blog-note h4{font-family:'Fraunces',serif;font-size:17px;margin:0 0 6px;color:var(--olive);font-weight:500;}
.blog-note p{margin:0;font-size:14px;line-height:1.6;color:var(--muted);}

@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.marquee-wrapper {
  display: flex;
  width: 100%;
  overflow: hidden;
  position: relative;
  padding: 10px 0;
}

.marquee-track {
  display: flex;
  gap: 20px;
  width: max-content;
  animation: marquee 35s linear infinite;
}

.marquee-track:hover {
  animation-play-state: paused;
}

.reviews-section{max-width:100%;margin:0 auto;padding:0 0 70px;overflow:hidden;}
.reviews-container-inner{max-width:1100px;margin:0 auto;padding:0 24px 24px;}
.reviews-head{display:flex;justify-content:space-between;align-items:center;}
.reviews-head h3{font-size:22px;}
.reviews-head a{font-size:13.5px;color:var(--vinted);text-decoration:none;font-weight:600;}

.review-card{
  background:var(--cream-card);border:1px solid var(--line);border-radius:6px;
  padding:22px;display:flex;flex-direction:column;gap:10px;
  width:320px;flex-shrink:0;box-shadow:0 4px 12px rgba(26,25,22,0.02);
}
.review-stars{color:var(--accent-gold);font-size:15px;letter-spacing:2px;}
.review-text{font-size:14px;line-height:1.6;color:var(--muted);font-style:italic;}
.review-author{font-size:12px;font-weight:600;color:var(--ink);margin-top:auto;}

.vinted-footer-badge-wrapper {max-width:1100px;margin:0 auto;padding:0 24px;}
.vinted-footer-badge{
  background:var(--cream-card);border:1px solid var(--line);border-radius:6px;padding:20px 24px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
  box-shadow:0 4px 12px rgba(26,25,22,0.02);
}
.vinted-footer-badge img{height:40px;width:auto;}

.insta-section{max-width:1100px;margin:0 auto;padding:0 24px 70px;}
.insta-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.insta-head h3{font-size:22px;}
.insta-head a{font-size:13.5px;color:var(--instagram);text-decoration:none;font-weight:600;}

.insta-grid-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  align-items: start;
}
@media (max-width: 950px) {
  .insta-grid-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 550px) {
  .insta-grid-row { grid-template-columns: 1fr; }
}

.faq-section{max-width:1100px;margin:0 auto;padding:0 24px 70px;}
.faq-head{margin-bottom:24px;}
.faq-head h3{font-size:24px;}
.faq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
@media(max-width:768px){.faq-grid{grid-template-columns:1fr;}}
.faq-card{background:var(--cream-card);border:1px solid var(--line);border-radius:6px;padding:24px;}
.faq-card h4{font-family:'Fraunces',serif;font-size:17px;margin-bottom:8px;color:var(--ink);}
.faq-card p{font-size:14px;line-height:1.6;color:var(--muted);margin:0;}

.contact-section{max-width:800px;margin:0 auto;padding:0 24px 80px;}
.contact-box{background:var(--olive-light);border:1px solid var(--line);border-radius:8px;padding:40px 36px;}
.contact-box h3{font-size:24px;margin-bottom:8px;color:var(--olive);}
.contact-box p{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
@media(max-width:640px){.form-row{grid-template-columns:1fr;}}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.form-group label{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.3px;}
.form-group input, .form-group textarea{
  background:var(--cream-card);border:1px solid var(--line);border-radius:4px;
  padding:12px 14px;font-family:'Work Sans',Arial,sans-serif;font-size:14.5px;color:var(--ink);
  outline:none;transition:border-color .2s;
}
.form-group input:focus, .form-group textarea:focus{border-color:var(--olive);}
.form-group textarea{resize:vertical;min-height:120px;}
.form-submit{
  background:var(--olive);color:#fff;border:none;border-radius:4px;
  padding:14px 28px;font-size:15px;font-weight:500;cursor:pointer;width:100%;transition:background .2s;
}
.form-submit:hover{background:var(--ink);}

.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(26,25,22,0.6);
  backdrop-filter: blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .3s ease;padding:20px;
}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{
  background:var(--cream-card);width:100%;max-width:900px;border-radius:8px;
  overflow:hidden;display:grid;grid-template-columns:1fr 1fr;position:relative;
  max-height:90vh;box-shadow:0 24px 50px rgba(26,25,22,0.2);
}
@media(max-width:768px){.modal{grid-template-columns:1fr;overflow-y:auto;}}
.modal-close{
  position:absolute;top:16px;right:16px;background:var(--cream);border:1px solid var(--line);
  width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:18px;z-index:10;transition:background .2s;
}
.modal-close:hover{background:var(--line);}
.modal-gallery{display:flex;flex-direction:column;background:#f0eee5;padding:20px;gap:12px;}
.modal-main-img{aspect-ratio:4/5;width:100%;overflow:hidden;border-radius:6px;background:#fff;}
.modal-main-img img{width:100%;height:100%;object-fit:cover;}
.modal-thumbs{display:flex;gap:8px;overflow-x:auto;}
.modal-thumb-item{width:60px;height:75px;border-radius:4px;overflow:hidden;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.modal-thumb-item.active{border-color:var(--olive);}
.modal-thumb-item img{width:100%;height:100%;object-fit:cover;}

.modal-content{padding:32px 28px;display:flex;flex-direction:column;overflow-y:auto;}
.modal-brand{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;font-weight:600;}
.modal-title{font-family:'Fraunces',serif;font-size:24px;margin-top:6px;line-height:1.2;}
.modal-price{font-size:20px;font-weight:600;margin-top:12px;color:var(--olive);}
.modal-desc{margin-top:20px;font-size:14.5px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;}
.modal-details-list{margin-top:16px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px;}
.modal-good{margin-top:14px;font-size:13px;line-height:1.5;color:var(--olive);background:var(--olive-light);border-radius:4px;padding:10px 12px;}
.modal-buy{
  margin-top:auto;padding-top:24px;display:block;background:var(--olive);color:#fff;
  text-align:center;padding:14px;border-radius:4px;font-weight:500;
  letter-spacing:.3px;text-decoration:none;transition:background .2s;
}
.modal-buy:hover{background:var(--ink);}

.about{background:var(--olive);color:#f5f3ea;padding:64px 24px;}
.about-inner{max-width:760px;margin:0 auto;text-align:center;}
.about h2{font-size:28px;}
.about p{margin-top:14px;line-height:1.7;font-size:15px;opacity:.92;}
.about-facts{margin-top:32px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;}
@media(max-width:640px){.about-facts{grid-template-columns:1fr;}}
.about-fact{border:1px solid rgba(245,243,234,0.28);border-radius:6px;padding:16px 12px;}
.about-fact strong{display:block;font-family:'Fraunces',serif;font-weight:500;font-size:18px;}
.about-fact span{display:block;margin-top:4px;font-size:13px;opacity:.85;}

footer{padding:44px 24px 60px;border-top:1px solid var(--line);background:var(--cream-card);}
.foot-inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;font-size:13px;color:var(--muted);}
.foot-col a{display:block;text-decoration:none;margin-bottom:8px;transition:color .2s;}
.foot-col a:hover{color:var(--olive);}
.foot-col h4{font-size:12px;text-transform:uppercase;color:var(--ink);margin-bottom
